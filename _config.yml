# -----------------------------------------------------------------------------
# Site settings
# -----------------------------------------------------------------------------

title: blank # the website title (if blank, will be used in the header)
first_name: Junteng
middle_name: 
last_name: Liu
email: jliugi@connect.ust.hk
description: >-
  Junteng Liu's personal homepage - First-year PhD candidate at HKUST NLP Group.
  Research focuses on natural language processing and machine learning.
repository: Modulezorlook/LJT-Homepage
repository_branch: master
logo:
  path: # path to logo file
  height: 50 # height in pixels
  width: 50 # width in pixels
lang: en
# Search
search: true

# Social links
github: "Vicent0205"
googlescholar: "https://scholar.google.com/citations?hl=en&user=tbK9jl4AAAAJ&view_op=list_works&sortby=pubdate"
twitter: "junteng88716710"

# -----------------------------------------------------------------------------
# Build settings
# -----------------------------------------------------------------------------
markdown: kramdown
highlighter: rouge
permalink: /:categories/:year/:month/:day/:title/
paginate: 5
paginate_path: /page:num/

# Plugins
plugins:
  - jekyll-paginate
  - jekyll-sitemap
  - jekyll-gist
  - jekyll-feed

# mimic GitHub Pages with --safe
whitelist:
  - jekyll-paginate
  - jekyll-sitemap
  - jekyll-gist
  - jekyll-feed

# -----------------------------------------------------------------------------
# Jekyll settings
# -----------------------------------------------------------------------------
kramdown:
  input: GFM
  syntax_highlighter: rouge
  syntax_highlighter_opts:
    css_class: 'highlight'

# -----------------------------------------------------------------------------
# Collections
# -----------------------------------------------------------------------------
collections:
  publications:
    output: true
    permalink: /publications/:path/

# -----------------------------------------------------------------------------
# Defaults
# -----------------------------------------------------------------------------
defaults:
  - scope:
      path: ""
      type: "publications"
    values:
      layout: "publication"

# -----------------------------------------------------------------------------
# Navigation
# -----------------------------------------------------------------------------
navigation:
  - title: "About"
    url: "/"
  - title: "Publications"
    url: "/publications/"
